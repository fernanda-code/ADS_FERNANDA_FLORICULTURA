<ui:composition template="/WEB-INF/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="title">Início</ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col-12">
                <div class="card">
                    <h2>Olá, #{loginBean.usuarioLogado.nome}!</h2>
                    <p>Bem-vindo(a) ao sistema de controle de estoque da floricultura.</p>
                    <p>Use o menu lateral para cadastrar plantas, categorias e locais e registrar as entradas e saídas do estoque.</p>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>
