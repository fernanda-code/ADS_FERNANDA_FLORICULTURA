<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      lang="pt-BR">

<h:head>
    <f:facet name="first">
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
        <meta name="apple-mobile-web-app-capable" content="yes"/>
    </f:facet>
    <title><ui:insert name="title">Floricultura</ui:insert></title>
    <h:outputScript name="js/layout.js" library="manhattan-layout"/>
    <ui:insert name="head"/>
</h:head>

<h:body>
    <div class="layout-wrapper layout-slim layout-light">
        <div class="layout-main">
            <ui:include src="./topbar.xhtml"/>

            <div class="layout-content">
                <p:growl id="growl" showDetail="true" life="4000"/>
                <ui:insert name="content"/>
            </div>

            <ui:include src="./footer.xhtml"/>

            <div class="layout-main-mask"></div>
        </div>

        <ui:include src="./sidebar.xhtml"/>
    </div>

    <p:ajaxStatus style="width:32px;height:32px;position:fixed;right:7px;bottom:7px">
        <f:facet name="start">
            <i class="pi pi-spin pi-spinner layout-ajax-loader-icon" aria-hidden="true"/>
        </f:facet>

        <f:facet name="complete">
            <h:outputText value=""/>
        </f:facet>
    </p:ajaxStatus>

    <h:outputStylesheet name="css/primeicons.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/primeflex.min.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/layout-green-orange.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/floricultura.css" library="floricultura"/>
</h:body>

</html>
