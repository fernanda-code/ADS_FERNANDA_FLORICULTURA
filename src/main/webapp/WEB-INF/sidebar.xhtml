<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:pm="http://primefaces.org/manhattan">

    <div class="layout-sidebar">
        <div class="layout-sidebar-logo">
            <svg class="flor-logo-sidebar" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"/>
            </svg>
            <a href="#" id="layout-sidebar-anchor" class="layout-sidebar-anchor" title="Alternar menu">
                <i class="pi"/>
            </a>
        </div>

        <div class="layout-menu-container">
            <h:form id="menuform">
                <pm:menu widgetVar="ManhattanMenuWidget">
                    <p:menuitem id="mnuInicio" value="Início" icon="pi pi-fw pi-home" outcome="/index.xhtml"/>
                    <p:menuitem id="mnuEstoque" value="Controle de Estoque" icon="pi pi-fw pi-sort-alt" outcome="/estoque.xhtml"/>
                    <p:menuitem id="mnuPlantas" value="Plantas" icon="pi pi-fw pi-star" outcome="/plantas.xhtml"/>
                    <p:menuitem id="mnuCategorias" value="Categorias" icon="pi pi-fw pi-tags" outcome="/categorias.xhtml"/>
                    <p:menuitem id="mnuLocais" value="Locais" icon="pi pi-fw pi-map-marker" outcome="/locais.xhtml"/>
                    <p:menuitem id="mnuUsuarios" value="Usuários" icon="pi pi-fw pi-users"
                                outcome="/admin/usuarios.xhtml" rendered="#{loginBean.admin}"/>
                </pm:menu>
            </h:form>
        </div>
    </div>

</ui:composition>
